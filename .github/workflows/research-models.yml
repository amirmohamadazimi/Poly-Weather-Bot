# Research only: pulls multi-model day-ahead forecasts, METAR reports for the
# cities the bot does not trade yet, and US MOS guidance for the forecast-model
# study (research/fetch_models.py), and commits them to this branch. Runs on
# pushes to the research-intraday branch that change that script; never on main.
name: research-models

on:
  push:
    branches: [research-intraday]
    paths: ["research/fetch_models.py", ".github/workflows/research-models.yml"]

permissions:
  contents: write

env:
  RANGE: 2025-10-01 2026-10-15

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      models: ${{ steps.probe.outputs.models }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - id: probe
        run: |
          models=$(python -m research.fetch_models $RANGE probe)
          echo "served: $models"
          echo "models=$models" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: research/data/models_probe.csv

  fetch:
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        step: ["daily 0 6", "daily 1 6", "daily 2 6", "daily 3 6", "daily 4 6", "daily 5 6", "metar", "mos"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m research.fetch_models $RANGE ${{ matrix.step }} ${{ needs.probe.outputs.models }}
      - id: name
        if: always()
        run: echo "name=$(echo '${{ matrix.step }}' | tr ' ' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-${{ steps.name.outputs.name }}
          path: |
            research/data/daily_prev_*.csv.gz
            research/data/metar_extra.csv.gz
            research/data/mos_*.csv.gz
          if-no-files-found: ignore

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: research/data
          merge-multiple: true
      - run: ls -la research/data
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research/data
          git commit -m "research: multi-model day-ahead forecasts, METAR for new cities, US MOS, $RANGE" || exit 0
          git push origin HEAD:research-intraday
