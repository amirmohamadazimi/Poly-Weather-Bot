# Runs the paper-trading bot in the cloud: one cycle every 3 hours.
#
# The SQLite database lives on the `paper-data` branch (a single commit that
# is replaced each run, so the repo does not grow). Each run restores it,
# runs one cycle, writes REPORT.md next to it, and pushes it back. Every run
# also uploads the database as a workflow artifact as a backup, and shows the
# report on the run's summary page.
#
# PAPER TRADING ONLY: app.mode is forced to "paper" and no secrets are used.
name: paper-trading

on:
  schedule:
    - cron: "7 */3 * * *"     # 00:07, 03:07, ... UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading        # never two runs at once; a queued run waits
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash               # -eo pipefail: a failed cycle fails the run
    env:
      WXBOT_APP__MODE: paper
      STATE_BRANCH: paper-data
      STATE_DIR: ${{ github.workspace }}/state
      WXBOT_APP__DATABASE_URL: sqlite:///${{ github.workspace }}/state/wxbot.sqlite3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore database from the paper-data branch
        run: |
          mkdir -p "$STATE_DIR"
          if git fetch --depth=1 origin "$STATE_BRANCH"; then
            git archive FETCH_HEAD | tar -x -C "$STATE_DIR"
            echo "restored: $(ls -la "$STATE_DIR")"
          else
            echo "no $STATE_BRANCH branch yet: starting a fresh experiment"
          fi

      - name: Fit calibration (first run only)
        run: python main.py backtest --if-missing

      - name: Run one paper-trading cycle
        run: python main.py once | tee "$STATE_DIR/last_cycle.json"

      - name: Write report
        run: |
          python main.py report > "$STATE_DIR/REPORT.md"
          cat "$STATE_DIR/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          # fold the SQLite write-ahead log into the main file before saving it
          python -c "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.execute('PRAGMA journal_mode=DELETE'); c.close()" "$STATE_DIR/wxbot.sqlite3"
          rm -f "$STATE_DIR"/wxbot.sqlite3-wal "$STATE_DIR"/wxbot.sqlite3-shm

      - name: Upload database backup
        uses: actions/upload-artifact@v4
        with:
          name: paper-data-${{ github.run_number }}
          path: state/
          retention-days: 14

      - name: Save database to the paper-data branch
        run: |
          cd "$STATE_DIR"
          git init -q -b "$STATE_BRANCH"
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Paper-trading state after run ${{ github.run_number }} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$STATE_BRANCH"
