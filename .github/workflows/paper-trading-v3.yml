# Experiment 3 ($100, 30 days, from 2026-10-15): one cycle every 3 hours, with
# the v2 production model (weighted-multimodel-v1). Experiments 1 and 2 stopped
# opening bets when this one started.
#
# Runs the newest commit of main on which CI (tests.yml: lint, types, tests,
# build) passed, so merged improvements reach it but untested code never does:
# while a new commit's CI is running or red, runs keep using the last green one.
# Every run records the commit it ran (WXBOT_GIT_REF); the experiments table
# keeps the commit it started on, and each change of code version is logged in
# system_events, so every result can be tied to the code that produced it.
# The starting bankroll, experiment name and length (30 days) are pinned here,
# so a config change cannot alter them.
#
# The SQLite database lives on the `v3-paper-trade` branch as wxbot.sqlite3.gz, in
# 90 MB parts once it outgrows that because GitHub refuses files over 100 MB
# (a single commit that is replaced each run, so the repo does not grow). Each
# run restores it, runs one cycle, writes REPORT.md next to it, and pushes it
# back. Every run also uploads the database as a workflow artifact as a backup,
# and shows the report on the run's summary page.
#
# PAPER TRADING ONLY: app.mode is forced to "paper" and no secrets are used.
name: paper-trading-v3

on:
  schedule:
    - cron: "22 2-23/3 * * *"   # 02:22, 05:22, ... UTC, between the other experiments' runs
  workflow_dispatch:

permissions:
  contents: write
  actions: read                 # to find the newest commit that passed CI

concurrency:
  group: paper-trading-v3       # never two runs at once; a queued run waits
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash               # -eo pipefail: a failed cycle fails the run
    env:
      WXBOT_APP__MODE: paper
      WXBOT_BANKROLL__INITIAL: "100"
      WXBOT_EXPERIMENT__NAME: exp3-v3-100usd
      WXBOT_EXPERIMENT__DAYS: "30"   # then no new bets; open ones settle (recorded once, so it cannot move)
      STATE_BRANCH: v3-paper-trade
      STATE_DIR: ${{ github.workspace }}/state
      WXBOT_APP__DATABASE_URL: sqlite:///${{ github.workspace }}/state/wxbot.sqlite3
    steps:
      - name: Find the newest commit of main that passed CI
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${{ github.repository }}/actions/workflows/tests.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$sha" ]; then
            echo "::error::no commit of main has passed CI; refusing to run untested code"
            exit 1
          fi
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::notice::running ${sha::12}, the newest commit that passed CI (this run was started on ${GITHUB_SHA::12})"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "WXBOT_GIT_REF=$sha" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.green.outputs.sha }}

      - name: Check the code has the v2 model
        run: |
          # experiment 3 is defined by the v2 model; older green commits must not run it
          if [ ! -f wxbot/model/weighted.py ]; then
            echo "::error::the newest green commit of main predates the v2 model; refusing to run experiment 3"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore database from the v3-paper-trade branch
        run: |
          mkdir -p "$STATE_DIR"
          # Only a branch that does not exist starts a fresh experiment: if the lookup
          # fails for any other reason the run stops, because the save step would
          # otherwise replace the experiment with a new one.
          rc=0
          git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null || rc=$?
          if [ "$rc" = 2 ]; then
            echo "no $STATE_BRANCH branch yet: starting a fresh experiment"
          elif [ "$rc" != 0 ]; then
            echo "::error::could not look up the $STATE_BRANCH branch (git ls-remote exit $rc); refusing to start over"
            exit 1
          else
            git fetch --depth=1 origin "$STATE_BRANCH"
            git archive FETCH_HEAD | tar -x -C "$STATE_DIR"
            # a database over 90 MB gzipped is saved in parts (GitHub refuses files over 100 MB)
            if compgen -G "$STATE_DIR/wxbot.sqlite3.gz.part-*" > /dev/null; then
              cat "$STATE_DIR"/wxbot.sqlite3.gz.part-* > "$STATE_DIR/wxbot.sqlite3.gz"
              rm "$STATE_DIR"/wxbot.sqlite3.gz.part-*
            fi
            if [ -f "$STATE_DIR/wxbot.sqlite3.gz" ]; then
              gunzip -f "$STATE_DIR/wxbot.sqlite3.gz"
            fi
            if [ ! -f "$STATE_DIR/wxbot.sqlite3" ]; then
              echo "::error::$STATE_BRANCH holds no database; refusing to start over"
              exit 1
            fi
            echo "restored: $(ls -la "$STATE_DIR")"
          fi

      - name: Load observation history for the climatology baseline (until it succeeds)
        run: |
          python main.py climatology --if-missing --years 3 \
            || echo "::warning::observation history did not load; the next run tries again"

      - name: Fit the station bias and spread for the normal-multimodel-v1 shadow (first run only)
        run: python main.py backtest --if-missing

      - name: Run one paper-trading cycle
        run: python main.py once | tee "$STATE_DIR/last_cycle.json"

      - name: Write report
        run: |
          python main.py report > "$STATE_DIR/REPORT.md"
          cat "$STATE_DIR/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          # the research report (did the experiment find positive EV?); a failure keeps the last one and the run
          if python main.py research > "$RUNNER_TEMP/RESEARCH.md"; then
            mv "$RUNNER_TEMP/RESEARCH.md" "$STATE_DIR/RESEARCH.md"
          else
            echo "::warning::the research report failed; RESEARCH.md was not updated"
          fi
          # fold the SQLite write-ahead log into the main file before saving it
          python -c "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.execute('PRAGMA journal_mode=DELETE'); c.close()" "$STATE_DIR/wxbot.sqlite3"
          rm -f "$STATE_DIR"/wxbot.sqlite3-wal "$STATE_DIR"/wxbot.sqlite3-shm

      - name: Upload database backup
        uses: actions/upload-artifact@v4
        with:
          name: v3-paper-trade-${{ github.run_number }}
          path: state/
          retention-days: 14

      - name: Save database to the v3-paper-trade branch
        run: |
          cd "$STATE_DIR"
          gzip -9 -f wxbot.sqlite3
          if [ "$(stat -c %s wxbot.sqlite3.gz)" -gt $((90 * 1024 * 1024)) ]; then
            split -b 90m -d -a 2 wxbot.sqlite3.gz wxbot.sqlite3.gz.part-   # join with: cat wxbot.sqlite3.gz.part-* > wxbot.sqlite3.gz
            rm wxbot.sqlite3.gz
          fi
          git init -q -b "$STATE_BRANCH"
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Experiment 3 state after run ${{ github.run_number }} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$STATE_BRANCH"
