[project]
name = "poly-weather-bot"
version = "0.2.0"
description = "Research and paper-trading platform for Polymarket daily temperature markets. Paper only."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "SQLAlchemy>=2.0",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.15",
    "mypy>=1.11",
    "types-requests>=2.31",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# zip(strict=True) would turn a length mismatch into a crash of the live loop
ignore = ["B905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
files = ["wxbot", "main.py"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["wxbot", "main"]

[tool.coverage.report]
fail_under = 90
