[project]
name = "poly-weather-bot"
version = "0.2.0"
description = "Research and paper-trading platform for Polymarket daily temperature markets. Paper only."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "SQLAlchemy>=2.0",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
