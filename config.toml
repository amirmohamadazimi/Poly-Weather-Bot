# Polymarket weather paper-trading bot: configuration.
#
# Every value here can be overridden by an environment variable named
# WXBOT_<SECTION>__<KEY>, for example WXBOT_STRATEGY__MIN_MODEL_PROB=0.85
# or WXBOT_APP__DATABASE_URL=postgresql://user:pass@host/db.
# Set WXBOT_CONFIG=/path/to/other.toml to use another file.

[app]
# "paper" is the only mode Phase 1 supports. See wxbot/execution/live.py.
mode = "paper"
database_url = "sqlite:///data/wxbot.sqlite3"
host = "127.0.0.1"          # use 0.0.0.0 on a server / in Docker
port = 8000
log_level = "INFO"
log_json = false            # true = one JSON object per log line (for servers)
# Set (via WXBOT_APP__DASHBOARD_PASSWORD) to require HTTP basic auth on a server.
dashboard_password = ""

[schedule]
cycle_minutes = 30          # full collect -> predict -> bet -> settle cycle
observation_hours = 6       # how often station observations are pulled
autostart = true            # start the autonomous loop when the app starts

[experiment]
# Recorded in the experiments table the first time a database is used, with the
# starting bankroll, code version and these settings. One database holds one
# experiment: a different starting bankroll on an existing database is refused.
name = "paper-100"
# Length in days (0 = no end). After it the bot opens no new bets; open ones
# still settle, and once the last has, the experiment is complete. Recorded with
# the experiment the first time it is set, so a later config change cannot move
# the end of an experiment already under way.
days = 0

[bankroll]
# Virtual dollars. Experiment 1 ($1,000) runs frozen code with its own config.
initial = 100.0

[markets]
# Polymarket tag holding the daily city temperature markets.
tag_slug = "daily-temperature"
# Only these kinds are priced: "high" (Highest temperature ...) and "low".
kinds = ["high", "low"]
# After a market resolves, store its hourly YES price history (one CLOB request)
# so later backtests can use the prices that were actually on offer.
store_price_history = true
# Per-cycle caps, so a backlog (e.g. after a pause) is worked off over several
# cycles instead of thousands of requests in one: price histories (newest
# markets first) and result checks for markets without a bet (oldest first;
# markets with an open bet are always checked).
max_price_histories_per_cycle = 300
max_result_checks_per_cycle = 500

[weather]
# Open-Meteo deterministic models fetched for every forecast. The v2 model
# ([model] version) weighs all of them; the older models, the station bias and
# spread sets and the backtests use [model] v1_models only. NBM and HRRR cover
# the US only. To go back to normal-multimodel-v1 in production, set [model]
# version to it and this list to the five v1_models.
models = ["ecmwf_ifs025", "gfs_seamless", "icon_seamless", "gem_seamless", "jma_seamless", "ecmwf_ifs",
          "ecmwf_aifs025_single", "ukmo_seamless", "meteofrance_seamless", "cma_grapes_global", "ncep_nbm_conus",
          "ncep_hrrr_conus"]
min_models = 3              # data-quality: fewer models than this -> no trade
max_forecast_age_minutes = 180

[validation]
# Inputs outside these bounds are rejected (and recorded) rather than used.
min_temp_c = -70.0
max_temp_c = 60.0
max_model_run_age_hours = 36   # a model value from an older run is rejected
outlier_c = 8.0                # >8 C from the other models' median: warning
min_obs_reports = 18           # METAR reports needed for a daily high/low

[model]
# weighted-multimodel-v1 (wxbot/model/weighted.py): every weather model above,
# each corrected by its own recent bias at the station and weighted by its
# recent accuracy there, with a spread from the combined forecast's recent
# error and today's disagreement between the models. The biases and errors are
# refitted daily ([model_stats]). normal-multimodel-v1 (wxbot/model/normal.py)
# is the earlier model: the plain mean of the five v1_models, corrected by the
# station bias/spread set ([learning]).
version = "weighted-multimodel-v1"
v1_models = ["ecmwf_ifs025", "gfs_seamless", "icon_seamless", "gem_seamless", "jma_seamless"]
# Forecast error standard deviation in degC by lead day, used until the
# backtest has fitted per-station values (see `python main.py backtest`).
default_sigma_c = [1.4, 1.7, 2.1, 2.5, 3.0]
# Never let the model claim more certainty than this for any single outcome.
prob_floor = 0.01
prob_ceiling = 0.99
min_calibration_samples = 20
# Baselines priced on every market next to the production model above. Their
# predictions are stored and scored (REPORT.md "Model comparison") but never
# traded. Known: "normal-multimodel-v1", "raw-forecast-v1", "climatology-v1"
# (one equal to version is skipped).
shadow_models = ["normal-multimodel-v1", "raw-forecast-v1", "climatology-v1"]
# climatology-v1: observed highs/lows within this many days of the same date in
# past years (load them with `python main.py climatology`); no prediction with
# fewer samples than climatology_min_samples.
climatology_window_days = 7
climatology_min_samples = 20

[calibration]
# Maps the production model's probability to one that matches how often such
# predictions came true (wxbot/calibration/). Refitted at most every
# refit_hours on resolved markets only; the newest holdout_fraction of them
# (by decision time) judges each fit, which is approved only if it beats the
# raw probabilities on both Brier score and log loss and at least min_samples
# markets were available. Without an approved fit the raw probability is used.
methods = ["isotonic", "platt"]
min_samples = 200
holdout_fraction = 0.3
# the log-loss gain must hold in this share of bootstrap resamples of the holdout
min_confidence = 0.95
# isotonic blocks smaller than this are merged, so no step rests on a few markets
isotonic_min_block = 20
refit_hours = 24

[market_anchor]
# Bet only where the model adds something to the market price
# (wxbot/calibration/anchor.py). The probability the rules use is the model's
# combined with the market's mid price, fitted on resolved markets whose book
# was tight. The fit is refitted at most every refit_hours and judged on the
# newest holdout_fraction of those markets: it counts only if it beats the
# market price alone there on both Brier score and log loss, with at least
# min_markets markets and the log-loss gain holding in min_confidence of
# bootstrap resamples. Until then no bet is placed (predictions and signals are
# still recorded). false goes back to betting on the model alone.
enabled = true
max_spread = 0.05           # a book wider than this (YES ask - YES bid) is not a price
min_markets = 300
holdout_fraction = 0.3
min_confidence = 0.95
refit_hours = 24

[nowcast]
# Same-day model, a forward test (wxbot/model/nowcast.py): on a market's own
# day it prices every bucket from the station's reports so far and the newest
# hourly forecast. Its predictions are stored as a shadow model and scored
# against the market price in REPORT.md. With bet = true it may also bet on
# markets with min_hours_left..max_hours_left hours to the end of their day,
# but only through its own market anchor (same rules as [market_anchor], fitted
# on its own predictions), so never before it has beaten the market price on
# resolved markets; with [market_anchor] off it never bets.
enabled = true
bet = true
min_hours_left = 1
max_hours_left = 18
max_report_age_minutes = 120   # no prediction when the newest station report is older
min_models = 2                 # forecast hours need this many models
# it knows when a bucket is already ruled out, so it may go closer to 0 and 1
prob_floor = 0.001
prob_ceiling = 0.999

[model_stats]
# The v2 model's per-station biases and errors (wxbot/learning/model_stats.py):
# refitted every refresh_hours from the last `days` days of past forecasts
# (Open-Meteo Previous Runs) and observed highs and lows; retry_hours after a
# refresh that fetched nothing. pause_seconds between stations keeps the
# requests under Open-Meteo's per-minute limit.
days = 120
refresh_hours = 24
retry_hours = 3
pause_seconds = 3

[learning]
# Retraining of normal-multimodel-v1's station bias and error spread
# (wxbot/learning/, README "How the learning system works"). Every retrain_days
# candidates are fitted on each train_days window of past forecasts and
# observations and judged on the markets of the newest holdout_days days, which
# none of them was fitted on. A candidate replaces production only if, on at
# least min_markets of those markets, its Brier score and log loss are both
# lower and the gain holds in min_confidence of bootstrap resamples of whole
# stations. The replaced set is kept, and put back automatically if the new one
# then does reliably worse on the markets it priced. false turns all of this off
# (the learning ledger is still written), and so does the v2 model in
# production, which refits its own biases ([model_stats]).
enabled = true
retrain_days = 7
holdout_days = 7
train_days = [30, 60, 90]
min_markets = 200
min_confidence = 0.95
bootstrap = 2000
retry_hours = 24            # after a retraining whose data could not be fetched

[backtest]
# Historical market backtest (python main.py backtest-markets): research only.
# It keeps its own database, so replayed markets never mix with a paper-trading
# experiment's ledger.
database_url = "sqlite:///data/backtest.sqlite3"
# Lead N uses Open-Meteo's previous_dayN forecast, whose value for every hour
# comes from a model run started at least N x 24 hours before that hour. A run
# is assumed downloadable this many hours after it starts (ECMWF's open data
# take about 7 to 8), so the decision for lead N is made at
# end of the local day - (24 x N - forecast_delay_hours) hours.
forecast_delay_hours = 8
leads = [1, 2, 3]
# Days of forecasts and observations before the window, for the first
# walk-forward bias/sigma fits (each fit uses at most this many past days).
train_days = 90
# Years of observations before the window, for the climatology baseline.
climatology_years = 3
# The CLOB's hourly price history is a mid price. Buying is assumed to cost
# this much more (half the bid-ask spread), plus [strategy] slippage and fee.
half_spread = 0.01
# The flat-stake result is also shown with these half spreads.
half_spread_sensitivity = [0.0, 0.01, 0.02, 0.03]
bootstrap = 2000

[strategy]
min_model_prob = 0.80       # confidence: model probability of the side we'd buy
min_edge = 0.05             # model prob - entry price (after fees/slippage)
min_ev_per_dollar = 0.04    # expected profit per $1 staked
max_entry_price = 0.97      # nothing above this: too little upside
min_entry_price = 0.03
min_liquidity_usd = 300     # Polymarket-reported market liquidity
min_lead_hours = 18         # hours from now to the END of the local target day
max_lead_hours = 96
max_sigma_c = 3.5           # skip when the forecast is too uncertain
fee_rate = 0.0              # taker fee as a fraction of notional
slippage = 0.005            # added to the order-book fill price

[sizing]
method = "fixed_fraction"   # or "fractional_kelly"
fraction = 0.02             # fixed_fraction: 2% of equity per bet ($2 of $100)
kelly_multiplier = 0.25     # fractional_kelly: quarter Kelly
min_stake = 1.0             # smaller stakes are not placed
max_book_share = 0.25       # take at most 25% of the visible ask depth

[risk]
# Caps on the stake, as fractions of equity (cash + open bets marked to market).
max_bet_pct = 0.02          # one bet
max_open_exposure_pct = 0.30    # all open bets, at cost
max_event_exposure_pct = 0.05   # all buckets of one event (one city, day and high/low)
max_station_day_exposure_pct = 0.08   # high and low events of one city-day together
daily_loss_limit_pct = 0.05     # 0 disables
